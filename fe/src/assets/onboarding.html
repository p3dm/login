<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Onboarding | D1A Agency</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800;900&amp;family=Space+Grotesk:wght@300;400;700&amp;family=Manrope:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#201f20",
                        "secondary-fixed-dim": "#8fd79d",
                        "surface": "#131314",
                        "primary-fixed-dim": "#2fe378",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#763213",
                        "on-surface-variant": "#bbcbba",
                        "on-secondary-container": "#82c88f",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary-fixed": "#00210b",
                        "secondary-fixed": "#abf3b7",
                        "primary": "#42ef83",
                        "on-secondary-fixed-variant": "#025226",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#00210b",
                        "primary-container": "#00d26a",
                        "on-background": "#e5e2e3",
                        "inverse-on-surface": "#313031",
                        "outline": "#859585",
                        "outline-variant": "#3c4a3d",
                        "surface-container-highest": "#353436",
                        "secondary": "#8fd79d",
                        "error-container": "#93000a",
                        "secondary-container": "#065528",
                        "inverse-surface": "#e5e2e3",
                        "on-surface": "#e5e2e3",
                        "surface-bright": "#3a393a",
                        "background": "#131314",
                        "on-primary-fixed-variant": "#005226",
                        "surface-variant": "#353436",
                        "on-secondary": "#003918",
                        "tertiary-fixed-dim": "#ffb598",
                        "on-primary": "#003918",
                        "primary-fixed": "#62ff95",
                        "tertiary-container": "#ff9e76",
                        "on-tertiary-container": "#783314",
                        "on-primary-container": "#005426",
                        "tertiary": "#ffc5af",
                        "on-tertiary": "#591d00",
                        "tertiary-fixed": "#ffdbce",
                        "surface-container-lowest": "#0e0e0f",
                        "surface-tint": "#2fe378",
                        "inverse-primary": "#006d34",
                        "surface-container-high": "#2a2a2b",
                        "surface-dim": "#131314",
                        "on-tertiary-fixed": "#370e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Montserrat"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .glow-soft {
            box-shadow: 0 0 40px rgba(66, 239, 131, 0.08);
        }

        .glow-card:hover {
            box-shadow: 0 0 32px rgba(66, 239, 131, 0.15);
        }

        .glass-panel {
            background: rgba(32, 31, 32, 0.6);
            backdrop-filter: blur(20px);
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">
    <!-- Subtle Ambient Background Glows -->
    <div
        class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full pointer-events-none">
    </div>
    <!-- Onboarding Navigation (Minimal) -->
    <header class="relative z-10 w-full px-8 py-10 flex justify-center">
        <div class="flex flex-col items-center gap-2">
            <span class="font-headline font-black text-4xl tracking-tighter text-white">D1A</span>
            <span class="font-headline text-[10px] uppercase tracking-[0.4em] text-primary font-bold">The Digital
                Architect</span>
        </div>
    </header>
    <!-- Main Canvas -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-6 pb-20">
        <div class="max-w-5xl w-full">
            <!-- Hero Instruction -->
            <div class="text-center mb-16">
                <h1 class="font-headline font-black text-4xl md:text-6xl text-white mb-6 tracking-tight">
                    Define Your <span class="text-primary italic">Trajectory.</span>
                </h1>
                <p
                    class="font-body font-light text-on-surface-variant text-lg md:text-xl max-w-xl mx-auto leading-relaxed">
                    Select your operational mode to customize your interface and begin your journey in the digital
                    marketplace.
                </p>
            </div>
            <!-- Role Selection Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                <!-- Freelancer Option -->
                <button
                    class="group relative flex flex-col items-start p-10 rounded-xl bg-surface-container-high border border-white/5 transition-all duration-500 glow-card hover:scale-[1.02] hover:bg-surface-container-highest text-left">
                    <div
                        class="mb-8 p-4 rounded-xl bg-surface-container-lowest text-primary group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl" data-icon="palette"
                            style="font-variation-settings: 'FILL' 1;">palette</span>
                    </div>
                    <h2
                        class="font-headline font-extrabold text-2xl text-white mb-3 group-hover:text-primary transition-colors">
                        I am a Freelancer (Creator)</h2>
                    <p class="font-body font-light text-on-surface-variant leading-relaxed">
                        Scale your creative output, manage premium clients, and earn competitive rates for your
                        specialized digital craft.
                    </p>
                    <div
                        class="mt-8 flex items-center gap-2 text-primary text-sm font-bold uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">
                        <span>Deploy Now</span>
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
                    </div>
                </button>
                <!-- Brand Option -->
                <button
                    class="group relative flex flex-col items-start p-10 rounded-xl bg-surface-container-high border border-white/5 transition-all duration-500 glow-card hover:scale-[1.02] hover:bg-surface-container-highest text-left">
                    <div
                        class="mb-8 p-4 rounded-xl bg-surface-container-lowest text-primary group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl" data-icon="rocket_launch"
                            style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                    </div>
                    <h2
                        class="font-headline font-extrabold text-2xl text-white mb-3 group-hover:text-primary transition-colors">
                        I am a Brand (Campaign Creator)</h2>
                    <p class="font-body font-light text-on-surface-variant leading-relaxed">
                        Source elite global talent, execute high-velocity campaigns, and architect your digital presence
                        with precision.
                    </p>
                    <div
                        class="mt-8 flex items-center gap-2 text-primary text-sm font-bold uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">
                        <span>Initiate Search</span>
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
                    </div>
                </button>
            </div>
            <!-- Secondary Actions -->
            <div class="flex flex-col items-center gap-8">
                <button
                    class="font-headline text-sm font-bold uppercase tracking-[0.2em] text-on-surface-variant hover:text-white transition-colors flex items-center gap-3 py-4 px-8 group">
                    <span>Continue as Guest</span>
                    <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform"
                        data-icon="chevron_right">chevron_right</span>
                </button>
                <!-- Status Progress -->
                <div class="flex items-center gap-4">
                    <div class="h-1 w-12 rounded-full bg-primary shadow-[0_0_8px_rgba(66,239,131,0.5)]"></div>
                    <div class="h-1 w-12 rounded-full bg-white/10"></div>
                    <div class="h-1 w-12 rounded-full bg-white/10"></div>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer Identity -->
    <footer class="relative z-10 w-full p-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-[10px] font-headline font-light uppercase tracking-widest text-slate-500">
            © 2024 D1A Agency. Engineered for the Future.
        </div>
        <div class="flex gap-8">
            <a class="text-[10px] font-headline font-light uppercase tracking-widest text-slate-500 hover:text-primary transition-colors"
                href="#">Privacy Policy</a>
            <a class="text-[10px] font-headline font-light uppercase tracking-widest text-slate-500 hover:text-primary transition-colors"
                href="#">API System</a>
            <a class="text-[10px] font-headline font-light uppercase tracking-widest text-slate-500 hover:text-primary transition-colors"
                href="#">Help Terminal</a>
        </div>
    </footer>
    <!-- Visual Texture Overlay -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay">
        <div class="w-full h-full bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
    </div>
</body>

</html>
